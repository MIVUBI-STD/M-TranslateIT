[package]
name = "translateit"
version = "0.1.0"
description = "TranslateIT Rust/Tauri conversion shell"
authors = ["Halo Karya Media"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
rubato = "=0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.11.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
