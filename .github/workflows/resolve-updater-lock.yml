name: Resolve updater Cargo lock

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/resolve-updater-lock.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve updater dependency into canonical lock
        run: cargo fetch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-cargo-lock
          path: EngineData/Frontend/RustApp/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
          # resolver rerun: pin updater 2.11.0
