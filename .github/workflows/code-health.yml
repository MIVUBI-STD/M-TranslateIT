name: Code Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select complete manual source proof
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      python: ${{ steps.scope.outputs.python }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - id: scope
        name: Require all source domains for explicit manual run
        shell: bash
        run: |
          {
            echo "frontend=true"
            echo "python=true"
            echo "rust=true"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend source health
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    concurrency:
      group: code-health-frontend-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:frontend
      - run: npm run test:frontend-runtime
      - run: npm run validate:source-size
      - run: npm run validate:bridge-contract
      - run: npm run validate:tauri-command-args
      - run: npm run validate:application-runtime
      - run: npm run validate:reachability
      - run: npm run validate:runtime-api-usage
      - run: npm run validate:test-references
      - run: npm run validate:test-ci-routing
      - run: npm run validate:dependency-usage
      - run: npm run validate:rust-dependency-usage
      - run: npm run validate:virtual-route
      - run: npm run preflight:tauri-package
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python source and unit health
    needs: changes
    if: needs.changes.outputs.python == 'true'
    concurrency:
      group: code-health-python-linux-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Install lock-resolved test tools only
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/translateit-ci-dev-requirements.txt"
          import tomllib
          from pathlib import Path

          wanted = {"ruff", "pytest", "huggingface-hub", "ffmpeg-python", "numpy"}
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          versions = {
              package.get("name"): package.get("version")
              for package in lock.get("package", [])
              if package.get("name") in wanted
          }
          missing = sorted(wanted - versions.keys())
          if missing:
              raise SystemExit(f"canonical uv.lock is missing CI test tools: {missing}")
          for name in sorted(wanted):
              print(f"{name}=={versions[name]}")
          PY
          python -m pip install -r "$RUNNER_TEMP/translateit-ci-dev-requirements.txt"
      - run: python -m compileall -q .
      - name: Python static correctness gate
        run: ruff check . --select E4,E7,E9,F,I
      - name: Python formatting gate
        run: ruff format --check .
      - name: Run Python contract tests
        run: python -m pytest -q

  python-windows:
    name: Windows Python source and unit health
    needs: changes
    if: needs.changes.outputs.python == 'true'
    concurrency:
      group: code-health-python-windows-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Install lock-resolved test tools only
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          wanted = {"ruff", "pytest", "huggingface-hub", "ffmpeg-python", "numpy"}
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          versions = {
              package.get("name"): package.get("version")
              for package in lock.get("package", [])
              if package.get("name") in wanted
          }
          missing = sorted(wanted - versions.keys())
          if missing:
              raise SystemExit(f"canonical uv.lock is missing CI test tools: {missing}")
          requirements = [f"{name}=={versions[name]}" for name in sorted(wanted)]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - run: python -m compileall -q .
      - name: Windows Python static correctness gate
        run: ruff check . --select E4,E7,E9,F,I
      - name: Windows Python formatting gate
        run: ruff format --check .
      - name: Run Windows Python contract tests
        run: python -m pytest -q

  rust:
    name: Rust source and unit health
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    concurrency:
      group: code-health-rust-linux-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Build frontend
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Install Linux Tauri dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libasound2-dev patchelf
      - name: Rust compiler/dead-code gate
        env:
          RUSTFLAGS: "-Ddead_code -Dunused_imports -Dunused_variables -Dunused_mut -Dunused_assignments"
        run: cargo check --locked
      - name: Rust Clippy correctness gate
        run: cargo clippy --locked --all-targets -- -D clippy::correctness
      - name: Run Rust unit tests
        run: cargo test --locked -- --test-threads=1

  rust-windows:
    name: Windows Rust source and unit health
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    concurrency:
      group: code-health-rust-windows-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci
      - name: Build frontend
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Show hosted Windows Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Windows Rust compiler gate
        env:
          RUSTFLAGS: "-Ddead_code -Dunused_imports -Dunused_variables -Dunused_mut -Dunused_assignments"
        run: cargo check --locked
      - name: Windows Rust Clippy correctness gate
        run: cargo clippy --locked --all-targets -- -D clippy::correctness
      - name: Run Windows Rust unit tests
        run: cargo test --locked -- --test-threads=1


  proof-summary:
    name: Exact SHA proof summary
    if: always()
    needs:
      - changes
      - frontend
      - python
      - python-windows
      - rust
      - rust-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write exact-SHA proof summary
        shell: bash
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PYTHON_WINDOWS_RESULT: ${{ needs.python-windows.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_WINDOWS_RESULT: ${{ needs.rust-windows.result }}
        run: |
          set -euo pipefail

          {
            echo "## TranslateIT Code Health"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo
            echo "| Domain | Changed | Result |"
            echo "|---|---:|---|"
            echo "| Frontend | $FRONTEND_CHANGED | $FRONTEND_RESULT |"
            echo "| Python Linux | $PYTHON_CHANGED | $PYTHON_RESULT |"
            echo "| Python Windows | $PYTHON_CHANGED | $PYTHON_WINDOWS_RESULT |"
            echo "| Rust Linux | $RUST_CHANGED | $RUST_RESULT |"
            echo "| Rust Windows | $RUST_CHANGED | $RUST_WINDOWS_RESULT |"
            echo
            echo "A skipped domain is not evidence for that domain. Only completed matching jobs on this exact SHA count as hosted source proof."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce matching changed-domain proof
        shell: bash
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PYTHON_WINDOWS_RESULT: ${{ needs.python-windows.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_WINDOWS_RESULT: ${{ needs.rust-windows.result }}
        run: |
          set -euo pipefail
          failed=false

          require_success() {
            local changed="$1"
            local result="$2"
            local label="$3"
            if [[ "$changed" == "true" && "$result" != "success" ]]; then
              echo "::error::$label required for this SHA but result was $result"
              failed=true
            fi
          }

          require_success "$FRONTEND_CHANGED" "$FRONTEND_RESULT" "Frontend source health"
          require_success "$PYTHON_CHANGED" "$PYTHON_RESULT" "Python Linux source health"
          require_success "$PYTHON_CHANGED" "$PYTHON_WINDOWS_RESULT" "Python Windows source health"
          require_success "$RUST_CHANGED" "$RUST_RESULT" "Rust Linux source health"
          require_success "$RUST_CHANGED" "$RUST_WINDOWS_RESULT" "Rust Windows source health"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
