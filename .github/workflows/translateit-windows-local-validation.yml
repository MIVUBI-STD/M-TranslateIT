name: TranslateIT Windows Local Validation

on:
  push:
    branches:
      - Local
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translateit-windows-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-source-validation:
    name: Windows source and integration contracts
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      EXPECTED_SHA: ${{ github.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require Local ref and exact candidate identity
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/Local') {
            throw 'Only the Local branch is eligible. Do not run this against main.'
          }
          if ($env:EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'GitHub supplied an invalid commit SHA.'
          }
          Write-Host "Exact selected Local commit: $env:EXPECTED_SHA"

      - name: Checkout exact dispatched source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Confirm clean tracked source and required lockfiles
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) {
            throw 'Checked-out source is not the requested candidate.'
          }
          if (git status --porcelain --untracked-files=no) {
            throw 'Tracked source is not clean.'
          }
          foreach ($file in @(
            'EngineData/Frontend/RustApp/package-lock.json',
            'EngineData/Frontend/RustApp/src-tauri/Cargo.lock',
            'EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock',
            'toolchain.json'
          )) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required candidate input missing: $file"
            }
          }
          Write-Host "Source verified: $env:EXPECTED_SHA"

      - name: Use locked frontend Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Use declared Windows Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Repository governance and source contracts
        id: repository_contract
        continue-on-error: true
        run: python tools/verify_repository.py

      - name: Repository tool regression tests
        id: repository_tests
        continue-on-error: true
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Record Windows runner and toolchain
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner image: $env:ImageOS / $env:ImageVersion"
          node --version
          python --version
          rustc --version
          cargo --version

      - name: Install pinned frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci

      - name: Sweep all frontend and bridge source validators
        id: source_checks
        continue-on-error: true
        working-directory: EngineData/Frontend/RustApp
        run: |
          $checks = @(
            'validate:bridge-contract',
            'validate:tauri-command-args',
            'validate:application-runtime',
            'validate:virtual-route',
            'validate:reachability',
            'validate:runtime-api-usage',
            'validate:test-references',
            'validate:test-ci-routing',
            'validate:dependency-usage',
            'validate:rust-dependency-usage',
            'check:rust',
            'preflight:tauri-package'
          )
          $failed = @()
          foreach ($check in $checks) {
            Write-Host "::group::npm run $check"
            npm run $check
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              Write-Host "::error::$check failed with exit code $code"
              $failed += "$check=$code"
            }
          }
          if ($failed.Count -gt 0) {
            throw "Failed source validators: $($failed -join '; ')"
          }

      - name: TypeScript and Svelte diagnostics
        id: typecheck
        continue-on-error: true
        working-directory: EngineData/Frontend/RustApp
        run: npm run typecheck

      - name: Frontend runtime and regression tests
        id: frontend_tests
        continue-on-error: true
        working-directory: EngineData/Frontend/RustApp
        run: npm run test:frontend-runtime

      - name: Build production frontend bundle
        id: frontend_bundle
        continue-on-error: true
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend

      - name: Install locked Python source-test dependencies
        id: python_deps
        continue-on-error: true
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: |
          $pinScript = 'import tomllib;from pathlib import Path;wanted={"pytest","ruff","numpy","huggingface-hub","ffmpeg-python","nltk","scipy","torch"};lock=tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"));found={p["name"]:p["version"] for p in lock["package"] if p["name"] in wanted};missing=wanted-set(found);assert not missing,f"Missing pinned tools: {missing}";print("\n".join(f"{name}=={found[name]}" for name in sorted(wanted)))'
          $requirements = @(python -c $pinScript)
          if ($LASTEXITCODE -ne 0 -or $requirements.Count -lt 8) {
            throw 'Could not resolve all worker test dependencies from the canonical uv.lock.'
          }
          python -m pip install @requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python syntax compilation
        id: python_syntax
        continue-on-error: true
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: python -m compileall -q .

      - name: Python Ruff source lint
        id: python_lint
        if: always() && steps.python_deps.outcome == 'success'
        continue-on-error: true
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: python -m ruff check . --select E4,E7,E9,F,I

      - name: Python Ruff format check
        id: python_format
        if: always() && steps.python_deps.outcome == 'success'
        continue-on-error: true
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: python -m ruff format --check .

      - name: Python worker unit tests
        id: python_tests
        if: always() && steps.python_deps.outcome == 'success'
        continue-on-error: true
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
        run: python -m pytest -q

      - name: Rust and Tauri Windows compiler gate
        id: rust_compile
        if: always() && steps.frontend_bundle.outcome == 'success'
        continue-on-error: true
        working-directory: EngineData/Frontend/RustApp/src-tauri
        run: cargo check --locked

      - name: Rust correctness gate
        id: rust_clippy
        if: always() && steps.rust_compile.outcome == 'success'
        continue-on-error: true
        working-directory: EngineData/Frontend/RustApp/src-tauri
        run: cargo clippy --locked --all-targets -- -D clippy::correctness

      - name: Rust Windows unit tests
        id: rust_tests
        if: always() && steps.rust_compile.outcome == 'success'
        continue-on-error: true
        working-directory: EngineData/Frontend/RustApp/src-tauri
        run: cargo test --locked -- --test-threads=1

      - name: Summarize all validation outcomes and fail on incomplete proof
        if: always()
        env:
          REPOSITORY_CONTRACT: ${{ steps.repository_contract.outcome }}
          REPOSITORY_TESTS: ${{ steps.repository_tests.outcome }}
          SOURCE_CHECKS: ${{ steps.source_checks.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FRONTEND_TESTS: ${{ steps.frontend_tests.outcome }}
          FRONTEND_BUNDLE: ${{ steps.frontend_bundle.outcome }}
          PYTHON_DEPS: ${{ steps.python_deps.outcome }}
          PYTHON_SYNTAX: ${{ steps.python_syntax.outcome }}
          PYTHON_LINT: ${{ steps.python_lint.outcome }}
          PYTHON_FORMAT: ${{ steps.python_format.outcome }}
          PYTHON_TESTS: ${{ steps.python_tests.outcome }}
          RUST_COMPILE: ${{ steps.rust_compile.outcome }}
          RUST_CLIPPY: ${{ steps.rust_clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## TranslateIT Windows Local source validation'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Workflow ref: $env:GITHUB_REF"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Source SHA: $env:GITHUB_SHA"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Runner: windows-2025 (hosted Windows Server, not the user PC)'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- GPU, private models, physical microphone, VB-CABLE, real meeting reception, native latency: NOT EXECUTED.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- This is source/test evidence only, never installer or native-device acceptance.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| Check | Outcome |'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '|---|---|'
          $checks = [ordered]@{
            'Repository source contracts' = $env:REPOSITORY_CONTRACT
            'Repository tool unit tests' = $env:REPOSITORY_TESTS
            'Source validators' = $env:SOURCE_CHECKS
            'TypeScript/Svelte' = $env:TYPECHECK
            'Frontend regression tests' = $env:FRONTEND_TESTS
            'Frontend bundle' = $env:FRONTEND_BUNDLE
            'Python pinned test tools' = $env:PYTHON_DEPS
            'Python compileall' = $env:PYTHON_SYNTAX
            'Python Ruff lint' = $env:PYTHON_LINT
            'Python Ruff formatting' = $env:PYTHON_FORMAT
            'Python pytest' = $env:PYTHON_TESTS
            'Windows Tauri compiler' = $env:RUST_COMPILE
            'Rust Clippy' = $env:RUST_CLIPPY
            'Rust unit tests' = $env:RUST_TESTS
          }
          $failed = @()
          foreach ($item in $checks.GetEnumerator()) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| $($item.Key) | $($item.Value) |"
            if ($item.Value -ne "success") { $failed += "$($item.Key):$($item.Value)" }
          }
          if ($failed.Count -gt 0) {
            throw "Source proof incomplete: $($failed -join '; ')"
          }
