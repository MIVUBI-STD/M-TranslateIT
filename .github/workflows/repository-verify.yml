name: Repository Verify

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Verify repository governance and source-validation routing
        run: python tools/verify_repository.py

      - name: Exercise advisory preflight regression cases
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Write exact-SHA proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Repository Verify"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo
            echo "This summary identifies the exact source revision evaluated by this workflow run. A completed successful run is source/contract evidence only; it is not TARGET_WINDOWS native acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
