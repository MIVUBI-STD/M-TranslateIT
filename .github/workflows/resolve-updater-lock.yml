name: Resolve updater Cargo lock

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/resolve-updater-lock.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve pinned updater dependency into canonical lock
        run: cargo fetch
      - name: Commit canonical Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(updater): sync Cargo lock"
          git push origin HEAD:Local
