name: R3 Release Contract

on:
  workflow_dispatch:
  push:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/scripts/build_r3_external_payload.py"
      - "EngineData/Frontend/RustApp/scripts/build_release.ps1"
      - "EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs"
      - "EngineData/Frontend/RustApp/scripts/optimize_release_payload.py"
      - "EngineData/Frontend/RustApp/scripts/stage_release_inputs.ps1"
      - "EngineData/Frontend/RustApp/scripts/stage_release_inputs_impl.ps1"
      - "EngineData/Frontend/RustApp/scripts/stage_release_license_material.py"
      - "EngineData/Frontend/RustApp/scripts/validate_release_model_revisions.mjs"
      - "EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs"
      - "EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs"
      - "EngineData/Frontend/RustApp/scripts/validate_tauri_package_preflight.mjs"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json"
      - "EngineData/Frontend/RustApp/src-tauri/windows/**"
      - "EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/**"
      - "EngineData/Backend/RuntimeAssets/Voice/BuiltInVoices/**"
      - "EngineData/Backend/RuntimeAssets/README.md"
      - "EngineData/Backend/LocalWorker/README.md"
      - "tools/translation_quality/validate_canonical_milmmt_repo.py"
      - "tools/quality_readiness/**"
      - ".github/workflows/release-payload-verify.yml"
  pull_request:
    branches:
      - Local
    paths:
      - "EngineData/Frontend/RustApp/scripts/build_r3_external_payload.py"
      - "EngineData/Frontend/RustApp/scripts/build_release.ps1"
      - "EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs"
      - "EngineData/Frontend/RustApp/scripts/optimize_release_payload.py"
      - "EngineData/Frontend/RustApp/scripts/stage_release_inputs.ps1"
      - "EngineData/Frontend/RustApp/scripts/stage_release_inputs_impl.ps1"
      - "EngineData/Frontend/RustApp/scripts/stage_release_license_material.py"
      - "EngineData/Frontend/RustApp/scripts/validate_release_model_revisions.mjs"
      - "EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs"
      - "EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs"
      - "EngineData/Frontend/RustApp/scripts/validate_tauri_package_preflight.mjs"
      - "EngineData/Frontend/RustApp/package.json"
      - "EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json"
      - "EngineData/Frontend/RustApp/src-tauri/windows/**"
      - "EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/**"
      - "EngineData/Backend/RuntimeAssets/Voice/BuiltInVoices/**"
      - "EngineData/Backend/RuntimeAssets/README.md"
      - "EngineData/Backend/LocalWorker/README.md"
      - "tools/translation_quality/validate_canonical_milmmt_repo.py"
      - "tools/quality_readiness/**"
      - ".github/workflows/release-payload-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  payload-scope:
    name: Detect controlled-payload impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      controlled: ${{ steps.scope.outputs.controlled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Classify release changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          controlled=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BASE"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              controlled=true
            else
              git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/translateit-r3-changed-paths.txt"
              while IFS= read -r path; do
                case "$path" in
                  EngineData/Frontend/RustApp/scripts/build_r3_external_payload.py|\
                  EngineData/Frontend/RustApp/scripts/build_release.ps1|\
                  EngineData/Frontend/RustApp/scripts/generate_third_party_notices.mjs|\
                  EngineData/Frontend/RustApp/scripts/optimize_release_payload.py|\
                  EngineData/Frontend/RustApp/scripts/stage_release_inputs.ps1|\
                  EngineData/Frontend/RustApp/scripts/stage_release_inputs_impl.ps1|\
                  EngineData/Frontend/RustApp/scripts/stage_release_license_material.py|\
                  EngineData/Frontend/RustApp/scripts/validate_release_model_revisions.mjs|\
                  EngineData/Frontend/RustApp/scripts/validate_release_payload.mjs|\
                  EngineData/Frontend/RustApp/scripts/validate_release_package_contract.mjs|\
                  EngineData/Frontend/RustApp/scripts/validate_tauri_package_preflight.mjs|\
                  EngineData/Frontend/RustApp/src-tauri/tauri.release.conf.json|\
                  EngineData/Frontend/RustApp/src-tauri/windows/*|\
                  EngineData/Backend/RuntimeAssets/AudioProvider/VBCABLE/*|\
                  EngineData/Backend/RuntimeAssets/Voice/BuiltInVoices/*|\
                  EngineData/Backend/RuntimeAssets/README.md|\
                  EngineData/Backend/LocalWorker/README.md|\
                  tools/translation_quality/validate_canonical_milmmt_repo.py|\
                  tools/quality_readiness/*|\
                  .github/workflows/release-payload-verify.yml)
                    controlled=true
                    break
                    ;;
                esac
              done < "$RUNNER_TEMP/translateit-r3-changed-paths.txt"
            fi
          fi

          echo "controlled=$controlled" >> "$GITHUB_OUTPUT"

  source-contract:
    name: R3 source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: python -m py_compile EngineData/Frontend/RustApp/scripts/build_r3_external_payload.py
      - name: Parse Windows release PowerShell
        shell: pwsh
        run: |
          foreach ($path in @(
            'EngineData/Frontend/RustApp/scripts/build_release.ps1',
            'EngineData/Frontend/RustApp/scripts/stage_release_inputs.ps1',
            'EngineData/Frontend/RustApp/scripts/stage_release_inputs_impl.ps1',
            'EngineData/Frontend/RustApp/src-tauri/windows/r3_payload_installer.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell parse errors found in $path." }
          }
      - name: Validate release source contracts
        working-directory: EngineData/Frontend/RustApp
        run: |
          node --check scripts/generate_third_party_notices.mjs
          node --check scripts/validate_tauri_package_preflight.mjs
          node --check scripts/validate_release_package_contract.mjs
          node scripts/validate_tauri_package_preflight.mjs
          node scripts/validate_release_package_contract.mjs
      - run: python tools/translation_quality/validate_canonical_milmmt_repo.py
      - name: Verify Quality Readiness release gate contract
        run: python tools/quality_readiness/release_gate_self_test.py

  controlled-payload:
    name: Controlled Windows payload proof
    needs:
      - payload-scope
      - source-contract
    if: github.event_name == 'push' && needs.payload-scope.outputs.controlled == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Stage controlled release inputs
        shell: pwsh
        run: |
          & 'EngineData/Frontend/RustApp/scripts/stage_release_inputs.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Controlled release input staging failed.' }
          python 'EngineData/Frontend/RustApp/scripts/stage_release_license_material.py'
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed Python license staging failed.' }
      - name: Validate and optimize controlled payload
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          node scripts/generate_third_party_notices.mjs --write
          npm run preflight:release-payload
          $backend = (Resolve-Path '../../Backend').Path
          $privatePython = Join-Path $backend 'LocalWorker/PythonRuntime/python.exe'
          & $privatePython scripts/optimize_release_payload.py --backend-root $backend
          if ($LASTEXITCODE -ne 0) { throw 'Release payload optimizer failed.' }
          node scripts/generate_third_party_notices.mjs --write
          npm run preflight:release-payload
          npm run preflight:tauri-package
      - name: Build bounded R3 payload evidence
        shell: pwsh
        run: |
          $app = (Resolve-Path 'EngineData/Frontend/RustApp').Path
          $repo = (Resolve-Path '.').Path
          $python = Join-Path $repo 'EngineData/Backend/LocalWorker/PythonRuntime/python.exe'
          $payload = Join-Path $env:RUNNER_TEMP 'TranslateIT-Payload.7z'
          $hook = Join-Path $env:RUNNER_TEMP 'translateit-r3-payload-hooks.generated.nsh'
          $evidence = Join-Path $env:RUNNER_TEMP 'translateit-r3-payload-build.json'
          & $python -s (Join-Path $app 'scripts/build_r3_external_payload.py') --repo-root $repo --output $payload --hook-template (Join-Path $app 'src-tauri/windows/r3_payload_hooks.template.nsh') --installer-helper (Join-Path $app 'src-tauri/windows/r3_payload_installer.ps1') --generated-hook $hook --evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw 'R3 external payload build failed.' }
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) { throw 'R3 payload evidence missing.' }
          Remove-Item -LiteralPath $payload,$hook -Force -ErrorAction SilentlyContinue
      - name: Upload bounded release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r3-controlled-payload-proof
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/translateit-r3-payload-build.json
