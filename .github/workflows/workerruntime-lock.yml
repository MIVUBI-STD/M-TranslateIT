name: WorkerRuntime Lock Consistency

on:
  workflow_dispatch:
  push:
    branches:
      - Local
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/workerruntime-lock.yml"
  pull_request:
    branches:
      - Local
    paths:
      - "EngineData/Backend/LocalWorker/WorkerRuntime/pyproject.toml"
      - "EngineData/Backend/LocalWorker/WorkerRuntime/uv.lock"
      - ".github/workflows/workerruntime-lock.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
      - run: uv lock --check
      - run: git diff --exit-code -- pyproject.toml uv.lock

      - name: Write exact-SHA proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WorkerRuntime Lock Consistency"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo
            echo "This summary identifies the exact source revision evaluated by this workflow run. A completed successful run is source/contract evidence only; it is not TARGET_WINDOWS native acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
